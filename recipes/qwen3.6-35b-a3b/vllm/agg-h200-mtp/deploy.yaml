#
# Qwen3.6-35B-A3B-FP8 — aggregated H200, TP1 + MTP(nst=3), 1 GPU per replica.
# 1,871.80 output tok/s/GPU at 71.60 tok/s/user P50, concurrency 32. See ../../perf/README.md
apiVersion: v1
kind: ConfigMap
metadata:
  name: qwen36-35b-a3b-vllm-h200-specdec-config
  labels:
    app.kubernetes.io/name: qwen36-35b-a3b-vllm-h200-agg-agentic
    app.kubernetes.io/part-of: dynamo
data:
  speculative-config-synthetic: |-
    {
      "method": "mtp",
      "num_speculative_tokens": 3,
      "rejection_sample_method": "synthetic",
      "synthetic_acceptance_length": 3.3153
    }
  speculative-config: |-
    {
      "method": "mtp",
      "num_speculative_tokens": 3
    }
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: qwen36-35b-a3b-vllm-h200-agg-agentic
  labels:
    app.kubernetes.io/name: qwen36-35b-a3b-vllm-h200-agg-agentic
    app.kubernetes.io/part-of: dynamo
spec:
  backendFramework: vllm
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0
              imagePullPolicy: IfNotPresent
              command: ["python3"]
              args:
                - -m
                - dynamo.frontend
                - --trust-remote-code
                - --http-host
                - 0.0.0.0
                - --http-port
                - "8000"

    - name: VllmWorker
      type: worker
      replicas: 1
      podTemplate:
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: nvidia.com/gpu.product
                        operator: In
                        values:
                          - NVIDIA-H200
          tolerations:
            - key: nvidia.com/gpu
              operator: Equal
              value: "true"
              effect: NoSchedule
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: model-cache
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 32Gi
            - name: runtime-tmp
              emptyDir: {}
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0
              imagePullPolicy: IfNotPresent
              command:
                - python3
                - -m
                - dynamo.vllm
              args:
                - --model
                - Qwen/Qwen3.6-35B-A3B-FP8
                - --served-model-name
                - Qwen/Qwen3.6-35B-A3B-FP8
                - --trust-remote-code
                - --enable-multimodal
                - --mm-encoder-tp-mode
                - data
                - --dyn-reasoning-parser
                - qwen3
                - --dyn-tool-call-parser
                - qwen3_coder
                - --reasoning-parser
                - qwen3
                - --tensor-parallel-size
                - "1"
                - --kv-cache-dtype
                - auto
                - --max-num-batched-tokens
                - "8192"
                - --gpu-memory-utilization
                - "0.9"
                - --speculative-config
                - $(SPECULATIVE_CONFIG)
              env:
                - name: HF_HOME
                  value: /model-cache
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: HF_MODULES_CACHE
                  value: /tmp/hf_modules
                - name: TRITON_CACHE_DIR
                  value: /tmp/.triton-cache
                - name: VLLM_CONFIG_ROOT
                  value: /tmp/vllm-config
                - name: VLLM_CACHE_ROOT
                  value: /tmp/vllm-cache
                - name: SPECULATIVE_CONFIG
                  valueFrom:
                    configMapKeyRef:
                      name: qwen36-35b-a3b-vllm-h200-specdec-config
                      # Use speculative-config-synthetic only for benchmarking.
                      key: speculative-config
              resources:
                requests:
                  nvidia.com/gpu: "1"
                  memory: 64Gi
                limits:
                  nvidia.com/gpu: "1"
              startupProbe:
                httpGet:
                  path: /live
                  port: 9090
                periodSeconds: 30
                timeoutSeconds: 20
                failureThreshold: 60
              volumeMounts:
                - name: model-cache
                  mountPath: /model-cache
                  readOnly: true
                - name: dshm
                  mountPath: /dev/shm
                - name: runtime-tmp
                  mountPath: /tmp
